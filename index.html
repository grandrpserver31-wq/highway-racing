<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Highway Real Racing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 20px; left: 25px;
    font-size: 18px; font-weight: 800;
    color: #fff;
    background: rgba(15, 23, 42, 0.7);
    padding: 12px 24px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    z-index: 5;
    display: none;
  }
  .hud-val { color: #38bdf8; font-size: 22px; }

  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.78);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .title {
    font-size: 45px; font-weight: 900; color: #38bdf8;
    text-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
    margin-bottom: 10px; letter-spacing: 2px; text-align: center;
  }
  .sub { font-size: 18px; color: #cbd5e1; margin-bottom: 35px; text-align: center; }
  .btn {
    padding: 18px 50px; font-size: 20px; font-weight: bold;
    background: #0284c7; color: #fff; border: none; border-radius: 40px;
    cursor: pointer; box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
    transition: all 0.2s ease; letter-spacing: 1px;
  }
  .btn:hover { transform: scale(1.08); background: #38bdf8; color: #0f172a; box-shadow: 0 0 35px #38bdf8; }

  #mobileBar {
    position: absolute; bottom: 30px; width: 100%;
    display: flex; justify-content: space-between; padding: 0 30px;
    pointer-events: none; z-index: 5;
  }
  .mBtn {
    width: 75px; height: 75px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.2); border: 2px solid #ffffff;
    color: #ffffff; font-size: 30px; display: flex; justify-content: center; align-items: center;
    pointer-events: auto; touch-action: manipulation;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
  }
  .mBtn:active { background: rgba(56, 189, 248, 0.6); border-color: #38bdf8; }

  #authBox {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin-bottom: 25px; min-height: 56px;
  }
  .userChip {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    padding: 8px 16px; border-radius: 30px; font-weight: 700; font-size: 16px;
    cursor: pointer; transition: 0.2s;
  }
  .userChip:hover { background: rgba(56,189,248,0.25); border-color: #38bdf8; }
  .linkBtn { background: none; border: none; color: #fca5a5; cursor: pointer; font-size: 13px; text-decoration: underline; }

  #loginBtn {
    padding: 14px 40px; font-size: 17px; font-weight: 800;
    background: #fff; color: #1f2937; border: none; border-radius: 40px;
    cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.3);
    display: flex; align-items: center; gap: 10px; transition: 0.2s;
  }
  #loginBtn:hover { transform: scale(1.05); background: #38bdf8; color: #0f172a; }

  #loginModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: none; justify-content: center; align-items: center;
    z-index: 200;
  }
  #loginModal.open { display: flex; }
  .modalCard {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(56,189,248,0.4);
    border-radius: 20px;
    padding: 35px 40px;
    min-width: 360px;
    max-width: 420px;
    box-shadow: 0 0 50px rgba(56,189,248,0.3);
  }
  .modalCard h2 {
    font-size: 26px; font-weight: 900; color: #38bdf8;
    text-align: center; margin-bottom: 8px;
  }
  .modalCard p {
    font-size: 14px; color: #94a3b8; text-align: center;
    margin-bottom: 25px;
  }
  .modalCard label {
    display: block; font-size: 13px; color: #cbd5e1;
    margin-bottom: 6px; font-weight: 700;
  }
  .modalCard input {
    width: 100%; padding: 14px 18px; font-size: 15px;
    background: rgba(255,255,255,0.06); color: #fff;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    margin-bottom: 18px; outline: none; transition: 0.2s;
  }
  .modalCard input:focus {
    border-color: #38bdf8; background: rgba(56,189,248,0.08);
  }
  .modalCard .mBtnRow {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .modalCard .mCreate {
    flex: 1; padding: 14px; font-size: 16px; font-weight: 800;
    background: #0284c7; color: #fff; border: none; border-radius: 30px;
    cursor: pointer; transition: 0.2s;
  }
  .modalCard .mCreate:hover { background: #38bdf8; color: #0f172a; }
  .modalCard .mCancel {
    padding: 14px 24px; font-size: 15px; font-weight: 700;
    background: rgba(255,255,255,0.1); color: #cbd5e1;
    border: none; border-radius: 30px; cursor: pointer;
  }
  .modalCard .mCancel:hover { background: rgba(255,255,255,0.2); }
  .modalCard .mError {
    color: #fca5a5; font-size: 13px; text-align: center;
    margin-top: 12px; min-height: 18px;
  }

  #userPopup {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    display: none; justify-content: center; align-items: center;
    z-index: 100;
  }
  #userPopup.open { display: flex; }
  .popupCard {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(56,189,248,0.4);
    border-radius: 18px;
    padding: 30px 40px;
    min-width: 320px;
    text-align: center;
    box-shadow: 0 0 40px rgba(56,189,248,0.3);
  }
  .popupCard .pname {
    font-size: 22px; font-weight: 900; color: #38bdf8;
    margin-bottom: 5px;
  }
  .popupCard .pemail {
    font-size: 14px; color: #94a3b8;
    margin-bottom: 20px;
  }
  .popupCard .pclose {
    padding: 10px 30px; font-size: 15px; font-weight: 700;
    background: #ef4444; color: #fff; border: none; border-radius: 30px;
    cursor: pointer;
  }
  .popupCard .pclose:hover { background: #dc2626; }

  #panelBtn {
    position: absolute; top: 20px; right: 20px; z-index: 30;
    padding: 10px 18px; font-size: 15px; font-weight: 800;
    background: rgba(15, 23, 42, 0.8); color: #fff;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
    cursor: pointer; backdrop-filter: blur(8px);
  }
  #panelBtn:hover { background: rgba(2,132,199,0.8); }
  #sidePanel {
    position: absolute; top: 70px; right: 20px; width: 290px; max-height: 70vh;
    z-index: 30; display: none; flex-direction: column;
    background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px; backdrop-filter: blur(10px); overflow: hidden;
  }
  #sidePanel.open { display: flex; }
  .tabs { display: flex; }
  .tab {
    flex: 1; padding: 12px 6px; text-align: center; font-weight: 800; font-size: 14px;
    cursor: pointer; background: rgba(255,255,255,0.06); color: #94a3b8;
  }
  .tab.active { background: rgba(56,189,248,0.2); color: #38bdf8; }
  .plist { overflow-y: auto; padding: 8px; }
  .prow {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px;
    border-radius: 8px; background: rgba(255,255,255,0.06); font-size: 14px;
  }
  .prow.me { background: rgba(56,189,248,0.22); border: 1px solid #38bdf8; }
  .prow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .prow .pt { color: #facc15; font-weight: 800; }
  .prow .rk { width: 26px; font-weight: 900; color: #94a3b8; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; flex: none; }
  .st { font-size: 12px; color: #94a3b8; }
  .empty { padding: 18px; text-align: center; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>

  <div id="hud">
    <div>PLAYER: <span id="playerName" class="hud-val" style="font-size:16px;">Guest</span></div>
    <div>SPEED: <span id="speedVal" class="hud-val">0</span> KM/H</div>
    <div>SCORE: <span id="scoreVal" class="hud-val" style="color:#facc15;">0</span></div>
  </div>

  <button id="panelBtn" onclick="togglePanel()">👥 LIVE <span id="liveCount">0</span> · 🏆</button>
  <div id="sidePanel">
    <div class="tabs">
      <div class="tab active" id="tabLive" onclick="showTab('live')">🟢 LIVE PLAYERS</div>
      <div class="tab" id="tabBoard" onclick="showTab('board')">🏆 TOP SCORE</div>
    </div>
    <div class="plist" id="listLive"></div>
    <div class="plist" id="listBoard" style="display:none;"></div>
  </div>

  <div id="startScreen" class="overlay">
    <div class="title">HIGHWAY RACING 3D</div>
    <div class="sub">Realistic Daytime World & Dynamic Speed</div>
    <div id="authBox"></div>
    <button class="btn" id="startBtn" onclick="startRace()" style="display:none;">START RACE</button>
  </div>

  <div id="gameOverScreen" class="overlay" style="display: none;">
    <div class="title" style="color:#ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.7);">CRASHED!</div>
    <div class="sub" id="finalScoreText" style="font-size: 24px; color: #facc15;">FINAL SCORE: 0</div>
    <button class="btn" onclick="startRace()" style="background:#ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);">RESTART</button>
  </div>

  <canvas id="canvas"></canvas>

  <div id="mobileBar">
    <div class="mBtn" id="btnLeft">←</div>
    <div class="mBtn" id="btnRight">→</div>
  </div>

  <div id="loginModal">
    <div class="modalCard">
      <h2>Create Account</h2>
      <p>নাম আর Gmail দিয়ে অ্যাকাউন্ট তৈরি করুন</p>
      <label>User Name</label>
      <input type="text" id="inpName" placeholder="যেমন: Rahim" maxlength="20">
      <label>Gmail</label>
      <input type="email" id="inpEmail" placeholder="example@gmail.com" maxlength="60">
      <div class="mBtnRow">
        <button class="mCreate" onclick="createAccount()">Create Account</button>
        <button class="mCancel" onclick="closeLoginModal()">Cancel</button>
      </div>
      <div class="mError" id="loginError"></div>
    </div>
  </div>

  <div id="userPopup" onclick="if(event.target.id==='userPopup') closeUserPopup()">
    <div class="popupCard">
      <div class="pname" id="popupName">User</div>
      <div class="pemail" id="popupEmail">email@gmail.com</div>
      <button class="pclose" onclick="closeUserPopup()">Close</button>
    </div>
  </div>

<script>
// ============ SETUP ============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W = window.innerWidth;
let H = window.innerHeight;

const fov = 250;
const roadW = 1200;
const PLAYER_Z = 250;
const P = 20000;
let cameraH = H * 0.7;

const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const hud = document.getElementById('hud');
const speedVal = document.getElementById('speedVal');
const scoreVal = document.getElementById('scoreVal');
const finalScoreText = document.getElementById('finalScoreText');

let gameState = 'menu';
let score = 0, speed = 0, maxSpeed = 3.5;
let playerX = 0, posZ = 0, tilt = 0, frame = 0;
let keys = { left: false, right: false };
let cars = [];

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(h, f) {
  const [r, g, b] = hex2rgb(h);
  const t = f < 0 ? 0 : 255, a = Math.abs(f);
  return `rgb(${Math.round(r + (t - r) * a)},${Math.round(g + (t - g) * a)},${Math.round(b + (t - b) * a)})`;
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function makePattern(base, darkA, lightA, size, count) {
  const c = newCanvas(size, size), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < count; i++) {
    const dark = Math.random() < 0.55;
    g.fillStyle = dark ? `rgba(0,0,0,${Math.random() * darkA})` : `rgba(255,255,255,${Math.random() * lightA})`;
    g.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  return ctx.createPattern(c, 'repeat');
}
const asphaltPat = makePattern('#3d4045', 0.30, 0.16, 160, 5200);
const grassPat   = makePattern('#3a7a2e', 0.28, 0.14, 160, 5200);

function paintGrad(g, y0, y1, col) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, shade(col, 0.38));
  gr.addColorStop(0.3, shade(col, 0.06));
  gr.addColorStop(0.75, shade(col, -0.28));
  gr.addColorStop(1, shade(col, -0.55));
  return gr;
}
function tire(g, x, y, w, h) {
  const gr = g.createLinearGradient(x, 0, x + w, 0);
  gr.addColorStop(0, '#040405'); gr.addColorStop(0.5, '#26262b'); gr.addColorStop(1, '#040405');
  g.fillStyle = gr; rr(g, x, y, w, h, 9); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1.5;
  for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x + 4, y + i * h / 5); g.lineTo(x + w - 4, y + i * h / 5); g.stroke(); }
}
function glassFill(g, pathFn) {
  g.save(); pathFn(g);
  const gr = g.createLinearGradient(0, 40, 0, 150);
  gr.addColorStop(0, '#6d93b5'); gr.addColorStop(0.35, '#22364a'); gr.addColorStop(1, '#070b10');
  g.fillStyle = gr; g.fill();
  g.clip();
  g.fillStyle = 'rgba(255,255,255,0.16)';
  g.beginPath(); g.moveTo(110, 0); g.lineTo(170, 0); g.lineTo(100, 300); g.lineTo(40, 300); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.08)';
  g.beginPath(); g.moveTo(215, 0); g.lineTo(240, 0); g.lineTo(170, 300); g.lineTo(145, 300); g.closePath(); g.fill();
  g.restore();
  g.save(); pathFn(g); g.strokeStyle = 'rgba(0,0,0,0.85)'; g.lineWidth = 3; g.stroke(); g.restore();
}
function tail(g, pathFn, cx, cy, r) {
  g.save(); pathFn(g);
  const gr = g.createLinearGradient(0, cy - r, 0, cy + r);
  gr.addColorStop(0, '#ff7a68'); gr.addColorStop(0.5, '#d41a1a'); gr.addColorStop(1, '#640808');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(25,0,0,0.9)'; g.lineWidth = 2; g.stroke();
  g.clip();
  g.fillStyle = 'rgba(255,255,255,0.28)'; g.fillRect(cx - r * 2, cy - r, r * 4, r * 0.45);
  g.restore();
  g.save();
  g.globalCompositeOperation = 'lighter';
  const rg = g.createRadialGradient(cx, cy, 2, cx, cy, r * 1.5);
  rg.addColorStop(0, 'rgba(255,60,40,0.5)'); rg.addColorStop(1, 'rgba(255,60,40,0)');
  g.fillStyle = rg; g.fillRect(cx - r * 2, cy - r * 2, r * 4, r * 4);
  g.restore();
}
function plate(g, x, y, w, h) {
  g.fillStyle = '#f4f4ef'; rr(g, x, y, w, h, 5); g.fill();
  g.strokeStyle = '#222'; g.lineWidth = 2; g.stroke();
  g.fillStyle = '#222'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `bold ${Math.round(h * 0.2)}px Arial`;
  g.fillText('DHAKA METRO', x + w / 2, y + h * 0.24);
  g.font = `bold ${Math.round(h * 0.42)}px Arial`;
  const num = Math.floor(rand(10, 99)) + '-' + Math.floor(rand(1000, 9999));
  g.fillText(num, x + w / 2, y + h * 0.66);
}
function bumper(g, x, y, w, h) {
  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, '#4a4d52'); gr.addColorStop(0.4, '#25272b'); gr.addColorStop(1, '#0c0d0f');
  g.fillStyle = gr; rr(g, x, y, w, h, 12); g.fill();
}
function exhaust(g, x, y, r) {
  const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
  gr.addColorStop(0, '#f2f4f7'); gr.addColorStop(0.6, '#8b9097'); gr.addColorStop(1, '#3a3d42');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#050505'; g.beginPath(); g.arc(x, y, r * 0.62, 0, Math.PI * 2); g.fill();
}
function underShadow(g, x, y, w, h) { g.fillStyle = 'rgba(0,0,0,0.8)'; rr(g, x, y, w, h, 10); g.fill(); }
function sheen(g, x, y, w, h) { g.fillStyle = 'rgba(255,255,255,0.2)'; rr(g, x, y, w, h, 5); g.fill(); }

const SPR_DIMS = { sedan: [400, 250], hatch: [400, 262], suv: [400, 292], truck: [400, 360], sport: [400, 232] };

function makeCarSprite(type, color) {
  const [w, h] = SPR_DIMS[type];
  const c = newCanvas(w, h), g = c.getContext('2d');
  const gy = h - 14;

  if (type === 'sedan') {
    tire(g, 30, gy - 56, 56, 56); tire(g, 314, gy - 56, 56, 56);
    underShadow(g, 44, gy - 30, 312, 30);
    g.fillStyle = paintGrad(g, 40, 140, color);
    g.beginPath(); g.moveTo(84, 134); g.lineTo(108, 54); g.quadraticCurveTo(200, 34, 292, 54); g.lineTo(316, 134); g.closePath(); g.fill();
    glassFill(g, gg => { gg.beginPath(); gg.moveTo(98, 128); gg.lineTo(118, 64); gg.quadraticCurveTo(200, 50, 282, 64); gg.lineTo(302, 128); gg.closePath(); });
    g.fillStyle = paintGrad(g, 124, gy - 22, color); rr(g, 26, 124, 348, gy - 22 - 124, 22); g.fill();
    sheen(g, 36, 129, 328, 9);
    g.strokeStyle = shade(color, -0.55); g.lineWidth = 2; g.beginPath(); g.moveTo(40, 160); g.lineTo(360, 160); g.stroke();
    tail(g, gg => { gg.beginPath(); gg.moveTo(38, 136); gg.lineTo(134, 140); gg.lineTo(126, 170); gg.lineTo(40, 172); gg.closePath(); }, 85, 154, 34);
    tail(g, gg => { gg.beginPath(); gg.moveTo(362, 136); gg.lineTo(266, 140); gg.lineTo(274, 170); gg.lineTo(360, 172); gg.closePath(); }, 315, 154, 34);
    bumper(g, 30, 198, 340, 32);
    plate(g, 160, 170, 80, 38);
    exhaust(g, 296, 224, 8);
    g.fillStyle = '#cfd2d6'; g.beginPath(); g.ellipse(200, 150, 9, 5, 0, 0, Math.PI * 2); g.fill();
  }

  if (type === 'hatch') {
    tire(g, 30, gy - 58, 56, 58); tire(g, 314, gy - 58, 56, 58);
    underShadow(g, 44, gy - 32, 312, 32);
    g.fillStyle = paintGrad(g, 44, 150, color);
    g.beginPath(); g.moveTo(72, 152); g.lineTo(84, 62); g.quadraticCurveTo(200, 38, 316, 62); g.lineTo(328, 152); g.closePath(); g.fill();
    glassFill(g, gg => { gg.beginPath(); gg.moveTo(90, 146); gg.lineTo(98, 76); gg.quadraticCurveTo(200, 58, 302, 76); gg.lineTo(310, 146); gg.closePath(); });
    g.fillStyle = shade(color, -0.35); rr(g, 92, 58, 216, 12, 6); g.fill();
    g.fillStyle = paintGrad(g, 140, gy - 24, color); rr(g, 26, 140, 348, gy - 24 - 140, 22); g.fill();
    sheen(g, 36, 146, 328, 9);
    tail(g, gg => { gg.beginPath(); gg.moveTo(34, 152); gg.lineTo(84, 152); gg.lineTo(82, 204); gg.lineTo(36, 208); gg.closePath(); }, 58, 180, 28);
    tail(g, gg => { gg.beginPath(); gg.moveTo(366, 152); gg.lineTo(316, 152); gg.lineTo(318, 204); gg.lineTo(364, 208); gg.closePath(); }, 342, 180, 28);
    bumper(g, 30, 208, 340, 30);
    plate(g, 160, 178, 80, 38);
    exhaust(g, 110, 232, 7);
  }

  if (type === 'suv') {

    quadAt(cx, y1, s1, y2, s2, 0.5, 0.58); ctx.fill();

    ctx.fillStyle = asphaltPat; quadAt(cx, y1, s1, y2, s2, -0.5, 0.5); ctx.fill();
    ctx.fillStyle = alt ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.02)';
    quadAt(cx, y1, s1, y2, s2, -0.5, 0.5); ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.11)';
    [[-0.355, -0.295], [-0.205, -0.145], [0.145, 0.205], [0.295, 0.355]].forEach(t => { quadAt(cx, y1, s1, y2, s2, t[0], t[1]); ctx.fill(); });

    ctx.fillStyle = 'rgba(240,240,232,0.95)';
    quadAt(cx, y1, s1, y2, s2, -0.478, -0.458); ctx.fill();
    quadAt(cx, y1, s1, y2, s2, 0.458, 0.478); ctx.fill();

    if (Math.floor(idx / 2) % 2 === 0) {
      ctx.fillStyle = 'rgba(245,245,238,0.95)';
      quadAt(cx, y1, s1, y2, s2, -0.008, 0.008); ctx.fill();
    }

    [-1, 1].forEach(side => {
      const x1 = cx + side * 0.58 * roadW * s1, x2 = cx + side * 0.58 * roadW * s2;
      const gp = Math.max(0.5, 2 * s1);
      ctx.fillStyle = alt ? '#bcc2c8' : '#a2a9b0';
      ctx.beginPath();
      ctx.moveTo(x1, y1 - 92 * s1); ctx.lineTo(x2, y2 - 92 * s2);
      ctx.lineTo(x2, y2 - 58 * s2); ctx.lineTo(x1, y1 - 58 * s1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = gp;
      ctx.beginPath(); ctx.moveTo(x1, y1 - 92 * s1); ctx.lineTo(x2, y2 - 92 * s2); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.moveTo(x1, y1 - 58 * s1); ctx.lineTo(x2, y2 - 58 * s2); ctx.stroke();
      if (alt) {
        ctx.fillStyle = '#5d6165';
        ctx.fillRect(x1 - 6 * s1, y1 - 96 * s1, 12 * s1, 96 * s1);
      }
    });
  }
}

function drawObjects() {
  const off = posZ % P;
  const list = [];
  for (let i = 0; i < objs.length; i++) {
    const o = objs[i];
    let rz = o.z - off;
    if (rz < 30) rz += P;
    if (rz > 12000) continue;
    list.push([rz, o]);
  }
  list.sort((a, b) => b[0] - a[0]);

  for (let i = 0; i < list.length; i++) {
    const rz = list[i][0], o = list[i][1];
    const p = project(o.x, cameraH, rz);
    if (p.scale <= 0) continue;
    const fade = clamp((12000 - rz) / 2500, 0, 1);

    if (o.k === 'pole') {
      const hh = 720 * p.scale, pw = 16 * p.scale;
      if (hh < 2) continue;
      ctx.globalAlpha = fade;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(p.x + pw * 2, p.y, pw * 3, pw * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      const pg = ctx.createLinearGradient(p.x - pw / 2, 0, p.x + pw / 2, 0);
      pg.addColorStop(0, '#9aa0a6'); pg.addColorStop(1, '#4e5258');
      ctx.fillStyle = pg; ctx.fillRect(p.x - pw / 2, p.y - hh, pw, hh);
      const dir = -Math.sign(o.x);
      ctx.strokeStyle = '#6b7076'; ctx.lineWidth = Math.max(1, 10 * p.scale); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y - hh); ctx.lineTo(p.x + dir * 150 * p.scale, p.y - hh - 24 * p.scale); ctx.stroke();
      ctx.fillStyle = '#d9dde0';
      ctx.fillRect(p.x + dir * 150 * p.scale - 34 * p.scale, p.y - hh - 32 * p.scale, 68 * p.scale, 16 * p.scale);
      ctx.globalAlpha = 1;
      continue;
    }

    const sp = o.k === 'bush' ? bushSprite : treeSprites[o.v];
    const dh = (o.k === 'bush' ? 300 : 1000) * o.s * p.scale;
    const dw = dh * sp.w / sp.h;
    if (dh < 2) continue;
    if (p.x + dw / 2 < 0 || p.x - dw / 2 > W) continue;
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.beginPath(); ctx.ellipse(p.x + dw * 0.16, p.y, dw * 0.42, dw * 0.05, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(sp.c, p.x - dw / 2, p.y - dh + dh * sp.pad, dw, dh);
    ctx.globalAlpha = 1;
  }
}

function drawCar(sp, x, z, opts) {
  const p = project(x, cameraH, z);
  if (p.scale <= 0) return;
  const dw = 290 * p.scale;
  const dh = dw * sp.h / sp.w;
  const pad = dw * 14 / sp.w;

  const sg = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, dw * 0.55);
  sg.addColorStop(0, 'rgba(0,0,0,0.65)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(1, 0.16);
  ctx.translate(-p.x, -p.y);
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(p.x, p.y, dw * 0.58, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(p.x, p.y + (opts && opts.bob ? opts.bob * p.scale : 0));
  if (opts && opts.tilt) ctx.rotate(opts.tilt);
  ctx.drawImage(sp.c, -dw / 2, -dh + pad, dw, dh);
  ctx.restore();
}

function drawHaze() {
  const y0 = H / 2 - H * 0.06, hh = H * 0.34;
  const g = ctx.createLinearGradient(0, y0, 0, y0 + hh);
  g.addColorStop(0, 'rgba(214,236,250,0)');
  g.addColorStop(0.25, 'rgba(214,236,250,0.85)');
  g.addColorStop(1, 'rgba(214,236,250,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, hh);
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.save();
  const sh = gameState === 'playing' ? (speed / maxSpeed) * 1.4 : 0;
  if (sh) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  drawEnvironment();
  drawRoad();
  drawObjects();

  const sorted = cars.slice().sort((a, b) => b.z - a.z);
  sorted.forEach(c => { if (c.z >= PLAYER_Z) drawCar(c.sp, c.x, c.z); });

  drawHaze();

  if (gameState === 'playing' || gameState === 'gameover') {
    const bob = gameState === 'playing' ? Math.sin(frame * 0.35) * 0.9 * (speed / maxSpeed + 0.3) : 0;
    drawCar(playerSprite, playerX, PLAYER_Z, { tilt: tilt, bob: bob });
  }
  sorted.forEach(c => { if (c.z < PLAYER_Z) drawCar(c.sp, c.x, c.z); });

  ctx.restore();
  if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0, W, H);
}

// =====================================================
// TRAFFIC LOGIC (RANDOM LANE + RANDOM LANE CHANGE)
// =====================================================
const LANES = [-0.25, 0.25];   // left lane, right lane
const LANE_SPEED = [30, 21];   // different speeds per lane

function update() {
  frame++;
  if (gameState === 'menu') { posZ += 10; return; }
  if (gameState !== 'playing') return;

  if (speed < maxSpeed) speed += 0.0006;
  posZ += speed * 35;
  score += Math.floor(speed * 2);
  speedVal.innerText = Math.floor(speed * 90);
  scoreVal.innerText = score;

  // ----- PLAYER MOVEMENT -----
  if (keys.left)  playerX -= 0.028;
  if (keys.right) playerX += 0.028;
  if (playerX < -0.30) playerX = -0.30;
  if (playerX >  0.30) playerX =  0.30;
  const targetTilt = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 0.05;
  tilt += (targetTilt - tilt) * 0.15;

  // ----- SPAWN TRAFFIC -----
  if (Math.random() < 0.022 + speed * 0.005) {
    const li = Math.floor(Math.random() * LANES.length);
    // Only spawn if no other car in same lane is too close to spawn point
    if (!cars.some(c => c.lane === li && c.z > 2800)) {
      const type = pickTrafficType();
      const color = type === 'truck' ? TRUCK_COLORS[Math.floor(Math.random() * TRUCK_COLORS.length)]
                                     : TRAFFIC_COLORS[Math.floor(Math.random() * TRAFFIC_COLORS.length)];
      // Random chance for the new car to change lanes while coming
      const willChangeLane = Math.random() < 0.5;  // 50% chance
      cars.push({
        x: LANES[li],
        z: 4000,
        v: LANE_SPEED[li],
        lane: li,
        targetLane: willChangeLane ? (1 - li) : li,
        changingIn: willChangeLane ? Math.floor(rand(40, 150)) : -1,  // frames until lane change
        changing: false,
        sp: getCarSprite(type, color)
      });
    }
  }

  // ----- MOVE TRAFFIC + LANE CHANGE + COLLISION -----
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    const step = speed * 35 - c.v;
    c.z -= step;

    // If lane change scheduled, decrement counter
    if (c.changingIn > 0) c.changingIn--;
    if (c.changingIn === 0 && !c.changing) c.changing = true;

    // Smoothly move x toward target lane
    if (c.changing) {
      const targetX = LANES[c.targetLane];
      const diff = targetX - c.x;
      c.x += Math.sign(diff) * Math.min(Math.abs(diff), 0.006);
      if (Math.abs(diff) < 0.01) {
        c.x = targetX;
        c.lane = c.targetLane;
        c.changing = false;
        c.changingIn = -1;
      }
    }

    // Collision check
    const dz = Math.abs(c.z - PLAYER_Z);
    const dx = Math.abs(c.x - playerX);
    if (dz < 55 && dx < 0.28) {
      gameState = 'gameover';
      finalScoreText.innerText = 'FINAL SCORE: ' + score;
      hud.style.display = 'none';
      gameOverScreen.style.display = 'flex';
      onGameOver(score);
      return;
    }

    if (c.z < 20) cars.splice(i, 1);
    else if (c.z > 6000) cars.splice(i, 1);
  }
}

function onGameOver(s) {}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();

// =====================================================
// LOGIN + LIVE + LEADERBOARD
// =====================================================
let me = null;
let onlineData = [];
let scoreData = [];
let heartbeatTimer = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function togglePanel() { document.getElementById('sidePanel').classList.toggle('open'); }
function showTab(t) {
  document.getElementById('listLive').style.display = t === 'live' ? 'block' : 'none';
  document.getElementById('listBoard').style.display = t === 'board' ? 'block' : 'none';
  document.getElementById('tabLive').classList.toggle('active', t === 'live');
  document.getElementById('tabBoard').classList.toggle('active', t === 'board');
}

function setAuthUI() {
  const box = document.getElementById('authBox');
  const startBtn = document.getElementById('startBtn');
  const pn = document.getElementById('playerName');

  if (me) {
    const nm = me.name || 'User';
    pn.innerText = nm;
    box.innerHTML =
      '<div class="userChip" onclick="openUserPopup()">' +
        '<span>' + esc(nm) + '</span>' +
      '</div>' +
      '<button class="linkBtn" onclick="doLogout()">Sign out</button>';
    startBtn.style.display = 'inline-block';
  } else {
    pn.innerText = 'Not logged in';
    box.innerHTML =
      '<button id="loginBtn" onclick="openLoginModal()">' +
        '<span style="font-weight:900;">👤</span> Login' +
      '</button>' +
      '<div style="font-size:13px;color:#fbbf24;text-align:center;">খেলার জন্য Login করুন</div>';
    startBtn.style.display = 'none';
  }
}

function openLoginModal() {
  document.getElementById('loginModal').classList.add('open');
  document.getElementById('loginError').innerText = '';
  document.getElementById('inpName').value = '';
  document.getElementById('inpEmail').value = '';
  setTimeout(() => document.getElementById('inpName').focus(), 100);
}

function closeLoginModal() {
  document.getElementById('loginModal').classList.remove('open');
}

async function createAccount() {
  const nameEl = document.getElementById('inpName');
  const emailEl = document.getElementById('inpEmail');
  const errEl = document.getElementById('loginError');

  const name = nameEl.value.trim();
  const email = emailEl.value.trim();
  errEl.innerText = '';

  if (name.length < 2) { errEl.innerText = 'নাম কমপক্ষে ২ অক্ষরের দিন'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.innerText = 'সঠিক Gmail দিন'; return; }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email })
    });
    const data = await res.json();
    if (!data.ok) { errEl.innerText = data.error || 'Login failed'; return; }

    me = data.user;
    localStorage.setItem('hr_user', JSON.stringify(me));
    closeLoginModal();
    setAuthUI();
    startHeartbeat();
    loadLive();
    loadBoard();
  } catch (e) {
    errEl.innerText = 'Server error: ' + e.message;
  }
}

function openUserPopup() {
  if (!me) return;
  document.getElementById('popupName').innerText = me.name || 'User';
  document.getElementById('popupEmail').innerText = me.email || '';
  document.getElementById('userPopup').classList.add('open');
}

function closeUserPopup() {
  document.getElementById('userPopup').classList.remove('open');
}

function doLogout() {
  if (me) {
    fetch('/api/offline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: me.uid })
    }).catch(() => {});
  }
  me = null;
  localStorage.removeItem('hr_user');
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  onlineData = [];
  renderLive();
  setAuthUI();
  gameState = 'menu';
  startScreen.style.display = 'flex';
  gameOverScreen.style.display = 'none';
  hud.style.display = 'none';
}

function sendOnline(status) {
  if (!me) return;
  fetch('/api/online', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      uid: me.uid, name: me.name, email: me.email,
      photo: '', status: status
    })
  }).catch(() => {});
}

function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  sendOnline(gameState === 'playing' ? 'playing' : 'menu');
  heartbeatTimer = setInterval(() => {
    sendOnline(gameState === 'playing' ? 'playing' : 'menu');
  }, 10000);
}

function setOnlineStatus(st) { sendOnline(st); }

async function saveScore(best) {
  if (!me) return;
  try {
    await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        uid: me.uid, name: me.name, email: me.email,
        photo: '', best: best
      })
    });
    loadBoard();
  } catch (e) {}
}

async function loadLive() {
  try {
    const res = await fetch('/api/live');
    onlineData = await res.json();
    renderLive();
  } catch (e) {}
}

async function loadBoard() {
  try {
    const res = await fetch('/api/leaderboard');
    scoreData = await res.json();
    renderBoard();
  } catch (e) {}
}

function renderLive() {
  document.getElementById('liveCount').innerText = onlineData.length;
  const el = document.getElementById('listLive');
  if (!onlineData.length) {
    el.innerHTML = '<div class="empty">এখন কেউ live নেই</div>';
    return;
  }
  el.innerHTML = onlineData.map(p => {
    const st = p.status === 'playing' ? '🎮 Playing' : '⏳ Menu';
    return '<div class="prow' + (me && me.uid === p.uid ? ' me' : '') + '">' +
      '<span class="dot"></span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<span class="st">' + st + '</span>' +
    '</div>';
  }).join('');
}

function renderBoard() {
  const el = document.getElementById('listBoard');
  if (!scoreData.length) {
    el.innerHTML = '<div class="empty">এখনো কেউ স্কোর করেনি</div>';
    return;
  }
  const medal = ['🥇', '🥈', '🥉'];
  el.innerHTML = scoreData.map((p, i) =>
    '<div class="prow' + (me && me.uid === p.uid ? ' me' : '') + '">' +
      '<span class="rk">' + (medal[i] || (i + 1)) + '</span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<span class="pt">' + p.best + '</span>' +
    '</div>'
  ).join('');
}

const _origStartRace = startRace;
startRace = function() {
  if (!me) { alert('আগে Login করুন!'); return; }
  _origStartRace();
};

const _origOnGameOver = onGameOver;
onGameOver = function(s) {
  setOnlineStatus('menu');
  saveScore(s);
};

(function init() {
  const cached = localStorage.getItem('hr_user');
  if (cached) {
    try {
      me = JSON.parse(cached);
      setAuthUI();
      startHeartbeat();
      loadLive();
      loadBoard();
    } catch (e) {
      me = null;
      setAuthUI();
    }
  } else {
    setAuthUI();
  }
  setInterval(loadLive, 15000);
  setInterval(loadBoard, 30000);
})();
</script>
