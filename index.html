<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Highway Real Racing</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 20px; left: 25px;
    font-size: 18px; font-weight: 800;
    color: #fff;
    background: rgba(15, 23, 42, 0.7);
    padding: 12px 24px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    z-index: 5;
    display: none;
  }
  .hud-val { color: #38bdf8; font-size: 22px; }

  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.78);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .title {
    font-size: 45px; font-weight: 900; color: #38bdf8;
    text-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
    margin-bottom: 10px; letter-spacing: 2px; text-align: center;
  }
  .sub { font-size: 18px; color: #cbd5e1; margin-bottom: 35px; text-align: center; }
  .btn {
    padding: 18px 50px; font-size: 20px; font-weight: bold;
    background: #0284c7; color: #fff; border: none; border-radius: 40px;
    cursor: pointer; box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
    transition: all 0.2s ease; letter-spacing: 1px;
  }
  .btn:hover { transform: scale(1.08); background: #38bdf8; color: #0f172a; box-shadow: 0 0 35px #38bdf8; }

  #mobileBar {
    position: absolute; bottom: 30px; width: 100%;
    display: flex; justify-content: space-between; padding: 0 30px;
    pointer-events: none; z-index: 5;
  }
  .mBtn {
    width: 75px; height: 75px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.2); border: 2px solid #ffffff;
    color: #ffffff; font-size: 30px; display: flex; justify-content: center; align-items: center;
    pointer-events: auto; touch-action: manipulation;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
  }
  .mBtn:active { background: rgba(56, 189, 248, 0.6); border-color: #38bdf8; }

  #authBox {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin-bottom: 25px; min-height: 56px;
  }
  .userChip {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    padding: 8px 16px; border-radius: 30px; font-weight: 700; font-size: 16px;
  }
  .userChip img { width: 30px; height: 30px; border-radius: 50%; }
  .linkBtn { background: none; border: none; color: #fca5a5; cursor: pointer; font-size: 13px; text-decoration: underline; }

  #panelBtn {
    position: absolute; top: 20px; right: 20px; z-index: 30;
    padding: 10px 18px; font-size: 15px; font-weight: 800;
    background: rgba(15, 23, 42, 0.8); color: #fff;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
    cursor: pointer; backdrop-filter: blur(8px);
  }
  #panelBtn:hover { background: rgba(2,132,199,0.8); }
  #sidePanel {
    position: absolute; top: 70px; right: 20px; width: 290px; max-height: 70vh;
    z-index: 30; display: none; flex-direction: column;
    background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px; backdrop-filter: blur(10px); overflow: hidden;
  }
  #sidePanel.open { display: flex; }
  .tabs { display: flex; }
  .tab {
    flex: 1; padding: 12px 6px; text-align: center; font-weight: 800; font-size: 14px;
    cursor: pointer; background: rgba(255,255,255,0.06); color: #94a3b8;
  }
  .tab.active { background: rgba(56,189,248,0.2); color: #38bdf8; }
  .plist { overflow-y: auto; padding: 8px; }
  .prow {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px;
    border-radius: 8px; background: rgba(255,255,255,0.06); font-size: 14px;
  }
  .prow.me { background: rgba(56,189,248,0.22); border: 1px solid #38bdf8; }
  .prow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .prow .pt { color: #facc15; font-weight: 800; }
  .prow .rk { width: 26px; font-weight: 900; color: #94a3b8; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; flex: none; }
  .st { font-size: 12px; color: #94a3b8; }
  .empty { padding: 18px; text-align: center; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>

  <div id="hud">
    <div>PLAYER: <span id="playerName" class="hud-val" style="font-size:16px;">Guest</span></div>
    <div>SPEED: <span id="speedVal" class="hud-val">0</span> KM/H</div>
    <div>SCORE: <span id="scoreVal" class="hud-val" style="color:#facc15;">0</span></div>
  </div>

  <button id="panelBtn" onclick="togglePanel()">👥 LIVE <span id="liveCount">0</span> · 🏆</button>
  <div id="sidePanel">
    <div class="tabs">
      <div class="tab active" id="tabLive" onclick="showTab('live')">🟢 LIVE PLAYERS</div>
      <div class="tab" id="tabBoard" onclick="showTab('board')">🏆 TOP SCORE</div>
    </div>
    <div class="plist" id="listLive"></div>
    <div class="plist" id="listBoard" style="display:none;"></div>
  </div>

  <div id="startScreen" class="overlay">
    <div class="title">HIGHWAY RACING 3D</div>
    <div class="sub">Realistic Daytime World & Dynamic Speed</div>
    <div id="authBox"></div>
    <button class="btn" id="startBtn" onclick="startRace()" style="display:none;">START RACE</button>
  </div>

  <div id="gameOverScreen" class="overlay" style="display: none;">
    <div class="title" style="color:#ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.7);">CRASHED!</div>
    <div class="sub" id="finalScoreText" style="font-size: 24px; color: #facc15;">FINAL SCORE: 0</div>
    <button class="btn" onclick="startRace()" style="background:#ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);">RESTART</button>
  </div>

  <canvas id="canvas"></canvas>

  <div id="mobileBar">
    <div class="mBtn" id="btnLeft">←</div>
    <div class="mBtn" id="btnRight">→</div>
  </div>

<script>
// =====================================================
// গেমের কোড — পুরনো index.html থেকে হুবহু কপি করুন
// =====================================================
// এখানে আপনার পুরনো index.html এর <script> এর ভিতরের সব কোড বসবে
// (SETUP, DRAWING HELPERS, CAR SPRITES, TREE, SKY, GAME CONTROL, RENDERING, UPDATE & LOOP)
// ঠিক "loop();" লাইন পর্যন্ত।

// =====================================================
// GOOGLE LOGIN + MONGODB (server.js এর সাথে কথা বলে)
// =====================================================
let me = null;
let onlineData = [];
let scoreData = [];
let heartbeatTimer = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function togglePanel() { document.getElementById('sidePanel').classList.toggle('open'); }
function showTab(t) {
  document.getElementById('listLive').style.display = t === 'live' ? 'block' : 'none';
  document.getElementById('listBoard').style.display = t === 'board' ? 'block' : 'none';
  document.getElementById('tabLive').classList.toggle('active', t === 'live');
  document.getElementById('tabBoard').classList.toggle('active', t === 'board');
}

function setAuthUI() {
  const box = document.getElementById('authBox');
  const startBtn = document.getElementById('startBtn');
  const pn = document.getElementById('playerName');

  if (me) {
    const nm = me.name || me.email;
    pn.innerText = nm;
    box.innerHTML =
      '<div class="userChip">' +
        (me.photo ? '<img src="' + esc(me.photo) + '" referrerpolicy="no-referrer">' : '') +
        '<span>' + esc(nm) + '</span>' +
      '</div>' +
      '<button class="linkBtn" onclick="doLogout()">Sign out</button>';
    startBtn.style.display = 'inline-block';
  } else {
    pn.innerText = 'Not logged in';
    box.innerHTML = '<div id="g_id_onload"></div>' +
      '<div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>';
    startBtn.style.display = 'none';
    setTimeout(renderGoogleBtn, 200);
  }
}

function renderGoogleBtn() {
  if (!window.google || !google.accounts || me) return;
  const clientId = window.GOOGLE_CLIENT_ID || 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
  google.accounts.id.initialize({
    client_id: clientId,
    callback: handleGoogleResponse
  });
  const btn = document.querySelector('.g_id_signin');
  if (btn) {
    google.accounts.id.renderButton(btn, {
      theme: 'outline', size: 'large', type: 'standard',
      text: 'signin_with', shape: 'rectangular'
    });
  }
}

async function handleGoogleResponse(response) {
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await res.json();
    if (!data.ok) { alert('Login failed'); return; }
    me = data.user;
    localStorage.setItem('hr_user', JSON.stringify(me));
    setAuthUI();
    startHeartbeat();
    loadLive();
    loadBoard();
  } catch (e) {
    console.error(e);
    alert('Login failed: ' + e.message);
  }
}

function doLogout() {
  if (me) {
    fetch('/api/offline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: me.uid })
    }).catch(() => {});
  }
  me = null;
  localStorage.removeItem('hr_user');
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  onlineData = [];
  renderLive();
  setAuthUI();
  gameState = 'menu';
  startScreen.style.display = 'flex';
  gameOverScreen.style.display = 'none';
  hud.style.display = 'none';
}

function sendOnline(status) {
  if (!me) return;
  fetch('/api/online', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      uid: me.uid, name: me.name, email: me.email,
      photo: me.photo, status: status
    })
  }).catch(() => {});
}

function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  sendOnline(gameState === 'playing' ? 'playing' : 'menu');
  heartbeatTimer = setInterval(() => {
    sendOnline(gameState === 'playing' ? 'playing' : 'menu');
  }, 10000);
}

function setOnlineStatus(st) {
  sendOnline(st);
}

async function saveScore(best) {
  if (!me) return;
  try {
    await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        uid: me.uid, name: me.name, email: me.email,
        photo: me.photo, best: best
      })
    });
    loadBoard();
  } catch (e) { console.error(e); }
}

async function loadLive() {
  try {
    const res = await fetch('/api/live');
    onlineData = await res.json();
    renderLive();
  } catch (e) { /* silent */ }
}

async function loadBoard() {
  try {
    const res = await fetch('/api/leaderboard');
    scoreData = await res.json();
    renderBoard();
  } catch (e) { /* silent */ }
}

function renderLive() {
  document.getElementById('liveCount').innerText = onlineData.length;
  const el = document.getElementById('listLive');
  if (!onlineData.length) {
    el.innerHTML = '<div class="empty">এখন কেউ live নেই</div>';
    return;
  }
  el.innerHTML = onlineData.map(p => {
    const st = p.status === 'playing' ? '🎮 Playing' : '⏳ Menu';
    return '<div class="prow' + (me && me.uid === p.uid ? ' me' : '') + '">' +
      '<span class="dot"></span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<span class="st">' + st + '</span>' +
    '</div>';
  }).join('');
}

function renderBoard() {
  const el = document.getElementById('listBoard');
  if (!scoreData.length) {
    el.innerHTML = '<div class="empty">এখনো কেউ স্কোর করেনি</div>';
    return;
  }
  const medal = ['🥇', '🥈', '🥉'];
  el.innerHTML = scoreData.map((p, i) =>
    '<div class="prow' + (me && me.uid === p.uid ? ' me' : '') + '">' +
      '<span class="rk">' + (medal[i] || (i + 1)) + '</span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<span class="pt">' + p.best + '</span>' +
    '</div>'
  ).join('');
}

// ---------- Login ছাড়া খেলা বন্ধ ----------
const _origStartRace = startRace;
startRace = function() {
  if (!me) { alert('আগে Google দিয়ে Login করুন!'); return; }
  _origStartRace();
};

// ---------- Crash হলে score সেভ ----------
const _origOnGameOver = onGameOver;
onGameOver = function(s) {
  setOnlineStatus('menu');
  saveScore(s);
};

// ---------- Auto login from localStorage ----------
(function init() {
  const cached = localStorage.getItem('hr_user');
  if (cached) {
    try {
      me = JSON.parse(cached);
      setAuthUI();
      startHeartbeat();
      loadLive();
      loadBoard();
    } catch (e) {
      me = null;
      setAuthUI();
    }
  } else {
    setAuthUI();
  }
  setInterval(loadLive, 15000);
  setInterval(loadBoard, 30000);
})();
</script>
</body>
</html>
